name: Keep Streamlit app awake

# Streamlit Community Cloud 무료 앱은 약 12시간 접속이 없으면 잠든다.
# 6시간마다 실제 브라우저로 접속해 깨어 있게 유지한다. (cron 은 UTC 기준)
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Visit app
        env:
          APP_URL: ${{ vars.STREAMLIT_APP_URL }}
        run: python scripts/keep_alive.py
      - name: Upload screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-alive-failure
          path: keep-alive-failure.png
          if-no-files-found: ignore
