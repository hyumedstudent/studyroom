name: Keep Streamlit app awake

# Streamlit Community Cloud 무료 앱은 약 12시간 접속이 없으면 잠든다.
# 6시간마다 실제 브라우저로 접속해 깨어 있게 유지한다. (cron 은 UTC 기준)
# 앱 화면을 확인하지 못하면 장애 이슈를 열고(A) 메일을 보내며(B),
# 다시 정상이 되면 이슈를 닫고 복구 메일을 보낸다. 장애가 이어지는 동안에는 다시 알리지 않는다.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: ${{ vars.STREAMLIT_APP_URL }}
      HAS_MAIL: ${{ secrets.MAIL_USERNAME != '' && secrets.MAIL_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit app
        id: visit
        continue-on-error: true
        shell: bash
        run: python scripts/keep_alive.py 2>&1 | tee keep-alive.log

      - name: Upload screenshot on failure
        if: steps.visit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: keep-alive-failure
          path: keep-alive-failure.png
          if-no-files-found: ignore

      # A. GitHub 이슈: 저장소를 Watch 하는 계정에 GitHub 이 메일로 알린다.
      - name: Open or close incident issue
        id: incident
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.visit.outcome }}
        with:
          script: |
            const title = "🚨 스터디룸 앱 장애 (자동 감지)";
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            core.setOutput("run_url", runUrl);
            const open = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100,
            })).filter((issue) => !issue.pull_request && issue.title === title);

            if (process.env.OUTCOME === "failure") {
              if (open.length) {
                core.info(`이미 열린 장애 이슈 #${open[0].number} 가 있어 다시 알리지 않습니다.`);
                return;
              }
              const issue = await github.rest.issues.create({
                owner, repo, title,
                body: [
                  `keep-alive 접속에서 스터디룸 앱 화면을 확인하지 못했습니다.`,
                  ``,
                  `- 앱 주소: ${process.env.APP_URL || "(STREAMLIT_APP_URL 미설정)"}`,
                  `- 실행 기록과 로그·스크린샷: ${runUrl}`,
                  ``,
                  `확인 순서: 앱 접속 → Streamlit Manage app 로그 → Supabase 대시보드(일시정지 여부).`,
                  `앱이 다시 정상으로 확인되면 이 이슈는 자동으로 닫힙니다.`,
                ].join("\n"),
              });
              core.info(`장애 이슈 #${issue.data.number} 를 열었습니다.`);
              core.setOutput("event", "down");
            } else if (open.length) {
              for (const issue of open) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `✅ 앱이 다시 정상으로 확인되어 자동으로 닫습니다. (${runUrl})`,
                });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed" });
              }
              core.setOutput("event", "recovered");
            }

      # B. Gmail 직접 발송: MAIL_USERNAME / MAIL_APP_PASSWORD 시크릿이 있을 때만 보낸다.
      - name: Send email alert
        if: steps.incident.outputs.event != '' && env.HAS_MAIL == 'true'
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          ALERT_EMAILS: ${{ vars.ALERT_EMAILS }}
          EVENT: ${{ steps.incident.outputs.event }}
          RUN_URL: ${{ steps.incident.outputs.run_url }}
        run: python scripts/send_alert_mail.py

      - name: Fail the run when the app is down
        if: steps.visit.outcome == 'failure'
        run: |
          echo "앱 화면을 확인하지 못했습니다. 위 'Visit app' 로그를 확인하세요."
          exit 1
